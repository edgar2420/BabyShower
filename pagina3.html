<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Shower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Alex+Brush&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pagina3.css">
</head>

<body>

    <div class="pagina pagina3">
        <img class="pagina-fondo" src="img/fondo3.jpg" alt="Fondo nubes">

        <img class="abeja abeja-1" src="img/abeja-removebg-preview.png" alt="">
        <img class="abeja abeja-2" src="img/abeja-removebg-preview.png" alt="">
        <img class="abeja abeja-3" src="img/abeja-removebg-preview.png" alt="">
        <img class="abeja abeja-4" src="img/abeja-removebg-preview.png" alt="">

        <div class="pagina3-contenido">
            <p class="p3-papitos">Mi Papitos</p>
            <p class="p3-padres">Edgar &amp; Vianka</p>

            <p class="p3-texto">
                Mientras Diosito sigue cuidándome y terminando de formarme en la pancita de mi mami,
                mis papis ya cuentan los días para conocerme y recibir mi llegada.
            </p>

            <p class="p3-subtitulo">
                <img class="p3-abeja-texto" src="img/abeja-removebg-preview.png" alt="">
                Mi Baby Shower
                <img class="p3-abeja-texto" src="img/abeja-removebg-preview.png" alt="">
            </p>

            <p class="p3-nombre">Amir Andres</p>

            <div class="p3-corazon">
                <div class="p3-corazon-placeholder">
                    <svg viewBox="0 0 24 24" width="34" height="34">
                        <path
                            d="M12 21s-7.5-4.6-10-9.2C.3 8.4 2 4.8 5.5 4.2 8 3.8 10 5 12 7c2-2 4-3.2 6.5-2.8C22 4.8 23.7 8.4 22 11.8 19.5 16.4 12 21 12 21z"
                            fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round" />
                    </svg>
                </div>
                <img class="p3-corazon-foto" src="img/pareja.jpg" alt="Foto de los papás"
                    onerror="this.style.display='none'">
            </div>

            <img class="p3-osito" src="img/morral-removebg-preview.png" alt="Osito Pooh">
        </div>
    </div>

</body>

</html>
