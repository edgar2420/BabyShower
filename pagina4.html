<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Shower</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Alex+Brush&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pagina4.css">
</head>

<body>

    <div class="pagina pagina4">
        <img class="pagina-fondo" src="img/fondo3.jpg" alt="Fondo nubes">

        <svg class="p4-panal" viewBox="0 0 120 140" width="130" height="150">
            <g fill="none" stroke="#cdd8de" stroke-width="1.2">
                <polygon points="20,5 35,13 35,29 20,37 5,29 5,13" />
                <polygon points="20,37 35,45 35,61 20,69 5,61 5,45" />
                <polygon points="20,69 35,77 35,93 20,101 5,93 5,77" />
                <polygon points="48,21 63,29 63,45 48,53 33,45 33,29" />
                <polygon points="48,53 63,61 63,77 48,85 33,77 33,61" />
            </g>
        </svg>

        <svg class="p4-arbol" viewBox="0 0 120 220" width="150" height="270">
            <rect x="55" y="60" width="10" height="160" fill="#9c7a54" />
            <circle cx="60" cy="90" r="55" fill="#8fbf7a" />
            <circle cx="30" cy="60" r="34" fill="#9ccb85" />
            <circle cx="90" cy="55" r="30" fill="#9ccb85" />
            <circle cx="60" cy="35" r="32" fill="#a8d590" />
        </svg>

        <img class="p4-abeja" src="img/abeja-removebg-preview.png" alt="">

        <div class="pagina4-contenido">
            <div class="p4-fecha">
                <div class="p4-fecha-mes">
                    <span>OCTUBRE</span>
                </div>
                <div class="p4-fecha-dia">
                    <span class="p4-fecha-dia-nombre">SÁBADO</span>
                    <span class="p4-fecha-dia-numero">10</span>
                </div>
                <div class="p4-fecha-hora">
                    <span>3:00 P.M.</span>
                </div>
            </div>

            <p class="p4-cuenta">Cuenta</p>
            <p class="p4-regresiva">REGRESIVA</p>

            <div class="p4-contador" id="contador">
                <div class="p4-bloque">
                    <span class="p4-numero" id="dias">00</span>
                    <span class="p4-etiqueta">DÍAS</span>
                </div>
                <span class="p4-separador">:</span>
                <div class="p4-bloque">
                    <span class="p4-numero" id="horas">00</span>
                    <span class="p4-etiqueta">HORAS</span>
                </div>
                <span class="p4-separador">:</span>
                <div class="p4-bloque">
                    <span class="p4-numero" id="minutos">00</span>
                    <span class="p4-etiqueta">MINUTOS</span>
                </div>
                <span class="p4-separador">:</span>
                <div class="p4-bloque">
                    <span class="p4-numero" id="segundos">00</span>
                    <span class="p4-etiqueta">SEGUNDOS</span>
                </div>
            </div>

            <div class="p4-recepcion">
                <p class="p4-recepcion-titulo">Recepción</p>
                <svg class="p4-pin" viewBox="0 0 24 24" width="42" height="42">
                    <path
                        d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z"
                        fill="#ffffff" />
                    <circle cx="12" cy="10" r="3" fill="#6f9cba" />
                </svg>
                <p class="p4-recepcion-texto">LUGAR DEL EVENTO</p>
            </div>
        </div>
    </div>

    <script src="js/pagina4.js"></script>

</body>

</html>
